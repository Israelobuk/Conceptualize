[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conceptualize"
version = "0.7.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.6,<3", "tiktoken>=0.8,<1", "httpx>=0.28,<1", "mcp>=1.9,<2", "pathspec>=0.12,<1", "tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-javascript>=0.25,<0.26", "networkx>=3.4,<4", "redis>=5,<7", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
conceptualize = "conceptualize.cli:main"
conceptualize-mcp = "conceptualize_mcp.server:main"
conceptualize-mcp-setup = "conceptualize_mcp.setup:main"
conceptualize-evaluate = "conceptualize_evaluation.runner:main"
conceptualize-evaluate-conversations = "conceptualize_evaluation.conversation_benchmark:main"

[tool.setuptools.packages.find]
where = ["apps/api", "apps/mcp", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/mcp", "packages"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
